# Deploys the site to Cloudflare Workers (static assets + server routes).
# Requires the repository secret CLOUDFLARE_API_TOKEN — see docs/DEPLOY.md.
# Account ID, bindings and the blog.custompcrepublic.com domain come from wrangler.json.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://blog.custompcrepublic.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          PUBLIC_GITHUB_LIVE: ${{ vars.PUBLIC_GITHUB_LIVE }}
          PUBLIC_SHOP_ENABLED: ${{ vars.PUBLIC_SHOP_ENABLED }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
